# 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/campus_card?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.campus_card_backend.entity
# 下划线→驼峰自动映射（user_id → userId），MyBatis starter 默认就是 true，显式写一下
mybatis.configuration.map-underscore-to-camel-case=true

# 端口
server.port=8080